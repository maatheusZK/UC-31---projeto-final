{% extends "base.html" %}

{% block titulo %}Editar Mensagem{% endblock %}

{% block conteudo %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow">

            <div class="card-header bg-warning">

                <h2 class="mb-0">
                    <i class="bi bi-pencil-square"></i>
                    Editar Mensagem
                </h2>

            </div>

            <div class="card-body">

                <form
                    action="{{ url_for('editar', id=mensagem.id) }}"
                    method="POST">

                    <div class="mb-3">

                        <label
                            for="tipo"
                            class="form-label">

                            Tipo da mensagem

                        </label>

                        <select
                            class="form-select"
                            id="tipo"
                            name="tipo"
                            required>

                            <option
                                value="Sugestão"
                                {% if mensagem.tipo == "Sugestão" %}selected{% endif %}>
                                Sugestão
                            </option>

                            <option
                                value="Elogio"
                                {% if mensagem.tipo == "Elogio" %}selected{% endif %}>
                                Elogio
                            </option>

                            <option
                                value="Reclamação"
                                {% if mensagem.tipo == "Reclamação" %}selected{% endif %}>
                                Reclamação
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label
                            for="titulo"
                            class="form-label">

                            Título

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="titulo"
                            name="titulo"
                            maxlength="60"
                            value="{{ mensagem.titulo }}"
                            required>

                    </div>

                    <div class="mb-4">

                        <label
                            for="descricao"
                            class="form-label">

                            Descrição

                        </label>

                        <textarea
                            class="form-control"
                            id="descricao"
                            name="descricao"
                            rows="6"
                            maxlength="500"
                            required>{{ mensagem.descricao }}</textarea>

                    </div>

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-success">

                            <i class="bi bi-check-circle-fill"></i>
                            Salvar Alterações

                        </button>

                        <a
                            href="{{ url_for('mensagens') }}"
                            class="btn btn-secondary">

                            <i class="bi bi-arrow-left"></i>
                            Cancelar

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
