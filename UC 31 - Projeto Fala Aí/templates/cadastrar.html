{% extends "base.html" %}

{% block titulo %}Enviar Mensagem{% endblock %}

{% block conteudo %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h2 class="mb-0">
                    <i class="bi bi-chat-square-text-fill"></i>
                    Enviar Mensagem
                </h2>

            </div>

            <div class="card-body">

                <form action="{{ url_for('cadastrar') }}" method="POST">

                    <div class="mb-3">

                        <label for="tipo" class="form-label">
                            Tipo da mensagem
                        </label>

                        <select
                            name="tipo"
                            id="tipo"
                            class="form-select"
                            required>

                            <option value="">Selecione...</option>

                            <option value="Sugestão">
                                Sugestão
                            </option>

                            <option value="Elogio">
                                Elogio
                            </option>

                            <option value="Reclamação">
                                Reclamação
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label for="titulo" class="form-label">
                            Título
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="titulo"
                            name="titulo"
                            maxlength="60"
                            placeholder="Digite um título"
                            required>

                    </div>

                    <div class="mb-4">

                        <label for="descricao" class="form-label">
                            Descrição
                        </label>

                        <textarea
                            class="form-control"
                            id="descricao"
                            name="descricao"
                            rows="6"
                            maxlength="500"
                            placeholder="Descreva sua mensagem..."
                            required></textarea>

                    </div>

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-success">

                            <i class="bi bi-send-fill"></i>
                            Enviar

                        </button>

                        <a
                            href="{{ url_for('index') }}"
                            class="btn btn-secondary">

                            <i class="bi bi-arrow-left"></i>
                            Voltar

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
