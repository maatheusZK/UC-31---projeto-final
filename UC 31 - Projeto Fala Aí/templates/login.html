{% extends "base.html" %}


{% block titulo %}Login Administrativo{% endblock %}



{% block conteudo %}


<div class="row justify-content-center">


    <div class="col-md-5">



        <div class="card shadow">



            <div class="card-header bg-primary text-white text-center">


                <h2 class="mb-0">

                    <i class="bi bi-person-lock"></i>

                    Área Administrativa

                </h2>


            </div>





            <div class="card-body">



                <p class="text-center">

                    Acesso exclusivo para administradores.

                </p>





                <form

                method="POST"

                action="{{ url_for('login') }}">





                    <div class="mb-3">


                        <label

                        for="usuario"

                        class="form-label">


                            Usuário


                        </label>





                        <input

                        type="text"

                        class="form-control"

                        id="usuario"

                        name="usuario"

                        placeholder="Digite o usuário"

                        required>



                    </div>





                    <div class="mb-3">


                        <label

                        for="senha"

                        class="form-label">


                            Senha


                        </label>





                        <input

                        type="password"

                        class="form-control"

                        id="senha"

                        name="senha"

                        placeholder="Digite a senha"

                        required>



                    </div>





                    <button

                    type="submit"

                    class="btn btn-primary w-100">



                        <i class="bi bi-box-arrow-in-right"></i>


                        Entrar



                    </button>




                </form>



            </div>



        </div>



    </div>



</div>



{% endblock %}
