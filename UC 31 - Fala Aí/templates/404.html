{% extends "base.html" %}


{% block titulo %}
Página não encontrada
{% endblock %}


{% block conteudo %}


<div class="text-center py-5">


    <h1 class="display-1 fw-bold">

        404

    </h1>


    <h2>

        Página não encontrada

    </h2>


    <p class="lead">

        A página que você tentou acessar não existe.

    </p>


    <a
        href="{{ url_for('index') }}"
        class="btn btn-primary">

        Voltar ao início

    </a>


</div>


{% endblock %}
