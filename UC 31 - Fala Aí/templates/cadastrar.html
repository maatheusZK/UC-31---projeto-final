{% extends "base.html" %}

{% block titulo %}
Nova Mensagem | FalaAí
{% endblock %}

{% block conteudo %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h3 class="mb-0">

                    Enviar Mensagem

                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">

                            Tipo

                        </label>

                        <select
                            class="form-select"
                            name="tipo"
                            required>

                            <option value="Sugestão">
                                Sugestão
                            </option>

                            <option value="Reclamação">
                                Reclamação
                            </option>

                            <option value="Elogio">
                                Elogio
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Título

                        </label>

                        <input
                            type="text"
                            name="titulo"
                            class="form-control"
                            maxlength="100"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            Descrição

                        </label>

                        <textarea
                            name="descricao"
                            class="form-control"
                            rows="6"
                            required></textarea>

                    </div>

                    <div class="d-flex gap-2">

                        <button
                            class="btn btn-primary">

                            Enviar

                        </button>

                        <a
                            href="{{ url_for('index') }}"
                            class="btn btn-secondary">

                            Cancelar

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
