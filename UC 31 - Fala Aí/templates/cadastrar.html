{% extends "base.html" %}

{% block conteudo %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow border-0">

            <div class="card-header bg-primary text-white">

                <h3 class="mb-0">
                    <i class="bi bi-plus-circle"></i>
                    Nova Manifestação
                </h3>

            </div>

            <div class="card-body">

                <form action="{{ url_for('cadastrar') }}" method="POST" class="needs-validation" novalidate>

                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Tipo de manifestação <span class="text-danger">*</span>
                        </label>

                        <div class="row g-3">

                            <div class="col-md-4">

                                <div class="card p-3 h-100">

                                    <div class="form-check">

                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            name="tipo"
                                            id="sugestao"
                                            value="Sugestão"
                                            checked
                                            required>

                                        <label class="form-check-label" for="sugestao">

                                            <strong>Sugestão</strong><br>

                                            <small class="text-muted">
                                                Compartilhe ideias para melhorar o sistema.
                                            </small>

                                        </label>

                                    </div>

                                </div>

                            </div>

                            <div class="col-md-4">

                                <div class="card p-3 h-100">

                                    <div class="form-check">

                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            name="tipo"
                                            id="reclamacao"
                                            value="Reclamação">

                                        <label class="form-check-label" for="reclamacao">

                                            <strong>Reclamação</strong><br>

                                            <small class="text-muted">
                                                Informe algum problema encontrado.
                                            </small>

                                        </label>

                                    </div>

                                </div>

                            </div>

                            <div class="col-md-4">

                                <div class="card p-3 h-100">

                                    <div class="form-check">

                                        <input
                                            class="form-check-input"
                                            type="radio"
                                            name="tipo"
                                            id="elogio"
                                            value="Elogio">

                                        <label class="form-check-label" for="elogio">

                                            <strong>Elogio</strong><br>

                                            <small class="text-muted">
                                                Reconheça um bom atendimento.
                                            </small>

                                        </label>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label for="titulo" class="form-label fw-bold">
                            Título <span class="text-danger">*</span>
                        </label>

                        <input
                            type="text"
                            id="titulo"
                            name="titulo"
                            class="form-control"
                            placeholder="Digite um título para sua manifestação"
                            maxlength="100"
                            required>

                        <div class="form-text">
                            Máximo de 100 caracteres.
                        </div>

                    </div>

                    <div class="mb-4">

                        <label for="descricao" class="form-label fw-bold">
                            Descrição <span class="text-danger">*</span>
                        </label>

                        <textarea
                            id="descricao"
                            name="descricao"
                            rows="6"
                            class="form-control"
                            placeholder="Descreva sua manifestação com o máximo de detalhes possível."
                            maxlength="1000"
                            required></textarea>

                        <div class="form-text">
                            Máximo de 1000 caracteres.
                        </div>

                    </div>

                    <div class="d-flex justify-content-end">

                        <a
                            href="{{ url_for('index') }}"
                            class="btn btn-secondary me-2">

                            <i class="bi bi-x-circle"></i>
                            Cancelar

                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary">

                            <i class="bi bi-send"></i>
                            Enviar Manifestação

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
