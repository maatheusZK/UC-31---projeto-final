{% extends "base.html" %}

{% block conteudo %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow border-0">

            <div class="card-header bg-primary text-white">

                <h3 class="mb-0">
                    <i class="bi bi-plus-circle"></i>
                    Nova Manifestação
                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Tipo de manifestação
                        </label>

                        <div class="row">

                            <div class="col-md-4">

                                <div class="form-check card p-3">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="tipo"
                                        value="Sugestão"
                                        id="sugestao"
                                        checked>

                                    <label class="form-check-label" for="sugestao">

                                         <strong>Sugestão</strong>

                                    </label>

                                </div>

                            </div>

                            <div class="col-md-4">

                                <div class="form-check card p-3">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="tipo"
                                        value="Reclamação"
                                        id="reclamacao">

                                    <label class="form-check-label" for="reclamacao">

                                         <strong>Reclamação</strong>

                                    </label>

                                </div>

                            </div>

                            <div class="col-md-4">

                                <div class="form-check card p-3">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="tipo"
                                        value="Elogio"
                                        id="elogio">

                                    <label class="form-check-label" for="elogio">

                                         <strong>Elogio</strong>

                                    </label>

                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Título

                        </label>

                        <input
                            type="text"
                            name="titulo"
                            class="form-control"
                            maxlength="100"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            Descrição

                        </label>

                        <textarea
                            name="descricao"
                            rows="6"
                            class="form-control"
                            required></textarea>

                    </div>

                    <div class="d-flex justify-content-end">

                        <a
                            href="{{ url_for('index') }}"
                            class="btn btn-secondary me-2">

                            Cancelar

                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary">

                            <i class="bi bi-send"></i>

                            Enviar Manifestação

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
