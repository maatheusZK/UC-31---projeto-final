{% extends "base.html" %}

{% block titulo %}
Editar Mensagem | FalaAí
{% endblock %}

{% block conteudo %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow">

            <div class="card-header bg-warning">

                <h3 class="mb-0">

                    Editar Mensagem

                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">

                            Tipo

                        </label>

                        <select
                            name="tipo"
                            class="form-select"
                            required>

                            <option 
                                value="Sugestão"
                                {% if mensagem.tipo == "Sugestão" %}selected{% endif %}>

                                Sugestão

                            </option>

                            <option 
                                value="Reclamação"
                                {% if mensagem.tipo == "Reclamação" %}selected{% endif %}>

                                Reclamação

                            </option>

                            <option 
                                value="Elogio"
                                {% if mensagem.tipo == "Elogio" %}selected{% endif %}>

                                Elogio

                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">

                            Título

                        </label>

                        <input
                            type="text"
                            name="titulo"
                            class="form-control"
                            value="{{ mensagem.titulo }}"
                            required>

                    </div>


                    <div class="mb-4">

                        <label class="form-label">

                            Descrição

                        </label>

                        <textarea
                            name="descricao"
                            class="form-control"
                            rows="6"
                            required>{{ mensagem.descricao }}</textarea>

                    </div>


                    <button
                        class="btn btn-success">

                        Salvar Alterações

                    </button>


                    <a
                        href="{{ url_for('mensagens') }}"
                        class="btn btn-secondary">

                        Voltar

                    </a>


                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
