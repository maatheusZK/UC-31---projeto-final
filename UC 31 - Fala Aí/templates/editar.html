{% extends "base.html" %}

{% block conteudo %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow border-0">

            <div class="card-header bg-warning">

                <h3 class="mb-0">
                    <i class="bi bi-pencil-square"></i>
                    Editar Manifestação
                </h3>

            </div>

            <div class="card-body">

                <form
                    action="{{ url_for('editar', id=mensagem.id) }}"
                    method="POST"
                    class="needs-validation"
                    novalidate>

                    <div class="mb-3">

                        <label for="tipo" class="form-label fw-bold">
                            Tipo de manifestação <span class="text-danger">*</span>
                        </label>

                        <select
                            id="tipo"
                            name="tipo"
                            class="form-select"
                            required>

                            <option value="Sugestão"
                                {% if mensagem.tipo == "Sugestão" %}selected{% endif %}>
                                Sugestão
                            </option>

                            <option value="Reclamação"
                                {% if mensagem.tipo == "Reclamação" %}selected{% endif %}>
                                Reclamação
                            </option>

                            <option value="Elogio"
                                {% if mensagem.tipo == "Elogio" %}selected{% endif %}>
                                Elogio
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label for="titulo" class="form-label fw-bold">
                            Título <span class="text-danger">*</span>
                        </label>

                        <input
                            type="text"
                            id="titulo"
                            name="titulo"
                            class="form-control"
                            value="{{ mensagem.titulo }}"
                            placeholder="Digite o título da manifestação"
                            maxlength="100"
                            required>

                        <div class="form-text">
                            Máximo de 100 caracteres.
                        </div>

                    </div>

                    <div class="mb-4">

                        <label for="descricao" class="form-label fw-bold">
                            Descrição <span class="text-danger">*</span>
                        </label>

                        <textarea
                            id="descricao"
                            name="descricao"
                            rows="6"
                            class="form-control"
                            placeholder="Descreva a manifestação..."
                            maxlength="1000"
                            required>{{ mensagem.descricao }}</textarea>

                        <div class="form-text">
                            Máximo de 1000 caracteres.
                        </div>

                    </div>

                    <div class="d-flex justify-content-end">

                        <a
                            href="{{ url_for('mensagens') }}"
                            class="btn btn-secondary me-2">

                            <i class="bi bi-x-circle"></i>
                            Cancelar

                        </a>

                        <button
                            type="submit"
                            class="btn btn-warning">

                            <i class="bi bi-check-circle"></i>
                            Salvar Alterações

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
