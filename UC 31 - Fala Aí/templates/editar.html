{% extends "base.html" %}

{% block conteudo %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow border-0">

            <div class="card-header bg-warning">

                <h3 class="mb-0">
                    <i class="bi bi-pencil-square"></i>
                    Editar Manifestação
                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Tipo
                        </label>

                        <select
                            name="tipo"
                            class="form-select">

                            <option value="Sugestão"
                            {% if mensagem.tipo=="Sugestão" %}selected{% endif %}>
                                Sugestão
                            </option>

                            <option value="Reclamação"
                            {% if mensagem.tipo=="Reclamação" %}selected{% endif %}>
                                Reclamação
                            </option>

                            <option value="Elogio"
                            {% if mensagem.tipo=="Elogio" %}selected{% endif %}>
                                Elogio
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Título
                        </label>

                        <input
                            type="text"
                            name="titulo"
                            class="form-control"
                            value="{{ mensagem.titulo }}"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Descrição
                        </label>

                        <textarea
                            name="descricao"
                            rows="6"
                            class="form-control"
                            required>{{ mensagem.descricao }}</textarea>

                    </div>

                    <div class="d-flex justify-content-end">

                        <a href="{{ url_for('mensagens') }}"
                           class="btn btn-secondary me-2">

                            Cancelar

                        </a>

                        <button
                            class="btn btn-warning">

                            <i class="bi bi-check-circle"></i>

                            Salvar Alterações

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
