{% extends "base.html" %}

{% block conteudo %}

<div class="row justify-content-center">

    <div class="col-xl-8 col-lg-10">

        <div class="card">

            <div class="card-header">

                <h3 class="mb-1">

                    <i class="bi bi-pencil-square"></i>

                    Editar Manifestação

                </h3>

                <p class="text-muted mb-0">

                    Atualize as informações da manifestação selecionada.

                </p>

            </div>

            <div class="card-body">

                <form
                    action="{{ url_for('editar', id=mensagem.id) }}"
                    method="POST">

                    <div class="mb-4">

                        <label for="tipo" class="form-label">

                            Tipo da manifestação

                        </label>

                        <select
                            id="tipo"
                            name="tipo"
                            class="form-select"
                            required>

                            <option value="Sugestão"
                                {% if mensagem.tipo == "Sugestão" %}selected{% endif %}>
                                Sugestão
                            </option>

                            <option value="Reclamação"
                                {% if mensagem.tipo == "Reclamação" %}selected{% endif %}>
                                Reclamação
                            </option>

                            <option value="Elogio"
                                {% if mensagem.tipo == "Elogio" %}selected{% endif %}>
                                Elogio
                            </option>

                        </select>

                    </div>

                    <div class="mb-4">

                        <label
                            for="titulo"
                            class="form-label">

                            Título

                        </label>

                        <input
                            type="text"
                            id="titulo"
                            name="titulo"
                            class="form-control"
                            maxlength="100"
                            value="{{ mensagem.titulo }}"
                            placeholder="Digite o título"
                            required>

                        <div class="form-text">

                            Máximo de 100 caracteres.

                        </div>

                    </div>

                    <div class="mb-4">

                        <label
                            for="descricao"
                            class="form-label">

                            Descrição

                        </label>

                        <textarea
                            id="descricao"
                            name="descricao"
                            rows="7"
                            class="form-control"
                            maxlength="1000"
                            placeholder="Descreva a manifestação..."
                            required>{{ mensagem.descricao }}</textarea>

                        <div class="form-text">

                            Máximo de 1000 caracteres.

                        </div>

                    </div>

                    <div class="d-flex justify-content-end gap-2">

                        <a
                            href="{{ url_for('mensagens') }}"
                            class="btn btn-outline-secondary">

                            <i class="bi bi-arrow-left"></i>

                            Voltar

                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary">

                            <i class="bi bi-check-circle-fill"></i>

                            Salvar Alterações

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
