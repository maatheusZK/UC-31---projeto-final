{% extends "base.html" %}

{% block titulo %}
Administrador
{% endblock %}

{% block conteudo %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header bg-dark text-white">

                <h3>

                    Login do Administrador

                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label>

                            Usuário

                        </label>

                        <input
                            type="text"
                            name="usuario"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-4">

                        <label>

                            Senha

                        </label>

                        <input
                            type="password"
                            name="senha"
                            class="form-control"
                            required>

                    </div>

                    <button
                        class="btn btn-primary w-100">

                        Entrar

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
